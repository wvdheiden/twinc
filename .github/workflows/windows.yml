# Builds the Windows zip (static twinc.exe) with MSYS2 and, for a v* tag, attaches
# it to the GitHub release of the tag.
name: Windows build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build package
        shell: msys2 {0}
        run: scripts/package-windows.sh
      - name: Smoke test
        shell: msys2 {0}
        run: ./twinc.exe --version
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x86_64
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --title "twinc $($env:GITHUB_REF_NAME.Substring(1))" --notes "Release notes follow."
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip).FullName --clobber
